<svg viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CRISP — Ripple badge">
  <title>CRISP — Crisis Reporter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3450"/>
      <stop offset="1" stop-color="#0E1F2F"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22455F"/>
      <stop offset="1" stop-color="#163349"/>
    </linearGradient>
  </defs>

  <rect width="340" height="110" rx="14" fill="url(#bg)"/>
  <rect x="12" y="14" width="82" height="82" rx="14" fill="url(#tile)"/>

  <!-- Response rings expanding from the epicenter (faint → bright inward) -->
  <circle cx="53" cy="55" r="34" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity="0.3"/>
  <circle cx="53" cy="55" r="26" fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.5"/>
  <circle cx="53" cy="55" r="18" fill="none" stroke="#22D3EE" stroke-width="2.2" opacity="0.78"/>
  <circle cx="53" cy="55" r="10" fill="none" stroke="#67E8F9" stroke-width="2.5"/>

  <!-- Epicenter -->
  <circle cx="53" cy="55" r="4" fill="#67E8F9"/>

  <!-- Responder en route on the second ring -->
  <circle cx="71" cy="37" r="2.8" fill="#FB7185"/>

  <text x="110" y="58"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="800" fill="white" letter-spacing="0.5">CRISP</text>
  <text x="110" y="80"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="0.3">Crisis Reporter</text>
</svg>
