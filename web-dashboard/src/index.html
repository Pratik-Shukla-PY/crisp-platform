<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRISP | UN Crisis Control Panel</title>
    <meta name="description" content="United Nations Crisis Response Intelligence System — hierarchical incident monitoring and strategic command center.">
    <meta name="theme-color" content="#7c3aed">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="dashboard-container">
    <div id="crisis-map"></div>

    <!-- Top Command Bar -->
    <header class="command-bar glass-panel">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-satellite-dish"></i></div>
            <div class="brand-text">
                <span class="brand-name">CRISP</span>
                <span class="brand-sub">UN Crisis Command Center</span>
            </div>
            <div class="live-badge"><span class="live-dot"></span>LIVE</div>
            <span id="cache-freshness-badge" title="Data freshness" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:rgba(124,58,237,0.12);color:var(--accent,#7c3aed);cursor:default;">● Live</span>
        </div>

        <div class="command-stats">
            <div class="stat-pill critical" id="stat-critical"><span id="count-critical">0</span><label>CRITICAL</label></div>
            <div class="stat-pill responding" id="stat-responding"><span id="count-responding">0</span><label>DISPATCHED</label></div>
            <div class="stat-pill resolved" id="stat-resolved"><span id="count-resolved">0</span><label>RESOLVED</label></div>
            <div class="stat-pill total"><span id="count-total">0</span><label>TOTAL</label></div>
        </div>

        <div class="command-actions">
            <div class="time-filter-bar">
                <button class="time-btn" onclick="setTimeFilter(1)">1h</button>
                <button class="time-btn active" onclick="setTimeFilter(24)">24h</button>
                <button class="time-btn" onclick="setTimeFilter(0)">All</button>
            </div>
            <button class="icon-btn" onclick="exportData('csv')"><i class="fa-solid fa-file-csv"></i> CSV</button>
            <button class="icon-btn" onclick="exportData('geojson')"><i class="fa-solid fa-globe"></i> GeoJSON</button>
            <button class="icon-btn deletion-btn" id="btn-pending-deletions" onclick="showPendingDeletions()" style="display:none;" title="View pending deletion requests">
                <i class="fa-solid fa-trash-clock"></i> <span id="deletion-count-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Pending Deletions Admin Panel (overlay) -->
    <div id="deletions-panel" class="deletions-panel" style="display:none;">
        <div class="del-panel-header">
            <h3><i class="fa-solid fa-trash-clock"></i> Pending Deletions</h3>
            <button class="close-btn" onclick="closeDeletionsPanel()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="del-panel-body" id="del-panel-body"></div>
    </div>

    <!-- QRT Response Queue Sidebar -->
    <aside class="feed-panel glass-panel">
        <div class="feed-header">
            <div class="feed-title">
                <i class="fa-solid fa-tower-broadcast text-accent"></i>
                <h2>Response Queue</h2>
                <span class="feed-count" id="feed-count-badge">0 Active</span>
            </div>
            <div class="header-tools" style="display:flex;align-items:center;gap:6px;">
                <div class="view-toggle">
                    <button class="view-btn active" data-mode="queue" onclick="setViewMode('queue')"><i class="fa-solid fa-bolt"></i> Queue</button>
                    <button class="view-btn" data-mode="tree" onclick="setViewMode('tree')"><i class="fa-solid fa-sitemap"></i> Tree</button>
                </div>
            </div>
        </div>

        <!-- Tree-mode controls (hidden in queue mode) -->
        <div id="tree-controls" style="display:none;">
            <div class="header-tools" style="padding:0 8px 6px;">
                <select id="sort-select" class="sort-select" onchange="sortMode=this.value; renderFeed()">
                    <option value="impact">Impact Score</option>
                    <option value="recent">Most Recent</option>
                    <option value="infra">Critical Infra</option>
                    <option value="density">Highest Density</option>
                </select>
            </div>
            <div class="status-tabs">
                <button class="stab active" id="stab-active" onclick="setStatusFilter('active')">Active</button>
                <button class="stab" id="stab-responding" onclick="setStatusFilter('responding')">Dispatched</button>
                <button class="stab" id="stab-resolved" onclick="setStatusFilter('resolved')">Resolved</button>
                <button class="stab" id="stab-all" onclick="setStatusFilter('all')">All</button>
            </div>
        </div>

        <div id="report-feed-list" class="incident-list"></div>
    </aside>

    <!-- Detail View -->
    <aside class="detail-panel glass-panel" id="detail-panel" style="display:none;">
        <div class="detail-header">
            <button class="close-btn" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="detail-title">Incident Detail</h3>
        </div>
        <div class="detail-body" id="detail-body"></div>
    </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="app.js?v=430"></script>

<!-- Offline status banner -->
<div id="offline-banner" style="
  display:none; position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:#1e1b4b; border:1px solid #7c3aed; border-radius:10px;
  padding:8px 18px; color:#c4b5fd; font-size:12px; font-weight:600;
  z-index:9999; gap:8px; align-items:center; box-shadow:0 4px 20px rgba(124,58,237,0.3);">
  <i class="fa-solid fa-wifi" style="color:#f59e0b"></i>
  &nbsp;Offline — showing cached data
</div>

<script>
// ── Service Worker registration ───────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/web-dashboard/src/sw.js', {
      scope: '/web-dashboard/src/'
    }).then(reg => {
      // Check for SW updates in background
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            newSW.postMessage('SKIP_WAITING');
          }
        });
      });
      console.log('[CRISP] Service Worker registered — offline mode active');
    }).catch(err => console.warn('[CRISP] SW registration failed:', err));
  });
}

// ── Offline / online banner ───────────────────────────────────────────────────
const offlineBanner = document.getElementById('offline-banner');
function updateOnlineStatus() {
  if (!navigator.onLine) {
    offlineBanner.style.display = 'flex';
  } else {
    offlineBanner.style.display = 'none';
  }
}
window.addEventListener('online',  updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
</script>
</body>
</html>
