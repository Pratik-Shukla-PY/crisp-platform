server {
    listen 80;
    server_name _;

    # ── Security Headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com; connect-src 'self' http://backend:8000; font-src 'self' https://cdnjs.cloudflare.com;" always;

    # Mobile app
    location /mobile-app/ {
        alias /usr/share/nginx/html/mobile-app/;
        try_files $uri $uri/ /mobile-app/src/index.html;
    }

    # Web dashboard
    location /web-dashboard/ {
        alias /usr/share/nginx/html/web-dashboard/;
        try_files $uri $uri/ /web-dashboard/src/index.html;
    }

    # Uploaded media files (photos, audio, satellite images)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Root redirect
    location = / {
        return 302 /web-dashboard/src/index.html;
    }
}
