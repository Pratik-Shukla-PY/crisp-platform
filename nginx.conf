server {
    listen 80;
    server_name _;

    # ── Security Headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Apr 2026 — CSP for prod deploy. Audited against every external CDN
    # the PWA + dashboard actually load at runtime:
    #
    # script-src (loadable JS):
    #   - cdnjs.cloudflare.com   FontAwesome icon font CSS hooks
    #   - unpkg.com              Leaflet (PWA + dashboard) + leaflet.markercluster
    #                            + leaflet.heat + @turf/turf (dashboard analytics)
    #   - cdn.jsdelivr.net       TensorFlow.js + @tensorflow-models/blazeface
    #                            (PWA client-side PII blur)
    #
    # style-src (loadable CSS):
    #   - cdnjs.cloudflare.com   FontAwesome
    #   - fonts.googleapis.com   Inter / Outfit / JetBrains Mono (Google Fonts)
    #   - unpkg.com              leaflet.css + MarkerCluster.css
    #
    # img-src (loadable images including blob: for in-memory canvases):
    #   - tile.openstreetmap.org   Leaflet OSM map tiles
    #   - api.mapbox.com           Mapbox fallback tiles + geocode renders
    #   - server.arcgisonline.com  Dashboard satellite-imagery tile layer
    #
    # connect-src (XHR/fetch destinations):
    #   - nominatim.openstreetmap.org   reverse-geocode lat/lng → place name
    #   - overpass-api.de               nearest-buildings tile (building selector)
    #   - api.mapbox.com                fallback geocoder
    #   - ipwho.is / ipapi.co / freeipapi.com
    #                                   coarse IP-based geo (GPS denied / desktop)
    #   - geocode.maps.co               dashboard reverse-geocode fallback
    #   - cdn.jsdelivr.net              TFJS fetches model JSON manifests inline
    #   - storage.googleapis.com        TFJS fetches model weight shards
    #     + *.googleapis.com            (broader fallback for any GCS-hosted model)
    #   - tfhub.dev                     legacy TFHub model registry (BlazeFace 0.1)
    #
    # font-src:
    #   - cdnjs.cloudflare.com  FontAwesome glyphs
    #   - fonts.gstatic.com     Google Fonts actual font files
    #
    # worker-src 'self' blob: — TFJS spawns workers via blob URLs for parallel
    # tensor ops; without this, the model ALSO fails to initialise.
    # 'unsafe-eval' in script-src is REQUIRED for TFJS / @tensorflow-models/*.
    # TensorFlow.js compiles WebGL shader code at runtime via eval()/new Function();
    # without this, the BlazeFace face detector throws EvalError on first
    # capture and pii-blur.js falls through with `skipped: true` — every
    # uploaded photo ships unblurred. This was the actual root cause of
    # the "PII blur not working in prod" symptom (April 2026 prod-deploy
    # debug session). 'unsafe-eval' adds minimal incremental risk over
    # 'unsafe-inline' which we already accept; the alternative is shipping
    # without ML-driven face blur, which is a larger compliance gap.
    # Apr 2026 — img-src extended with unpkg.com because Leaflet ships its
    # default marker icons (marker-icon.png, marker-icon-2x.png,
    # marker-shadow.png) from there. Without this, the map renders but
    # the location pin + cluster markers are invisible.
    #
    # connect-src extended with www.kaggle.com because newer
    # @tensorflow-models/blazeface@0.1.0 redirects from tfhub.dev to a
    # Kaggle-hosted model.json. The first time `blazeface.load()` runs,
    # it follows the redirect; if Kaggle isn't whitelisted, the model
    # never downloads and pii-blur.js falls through with skipped:true.
    # img-src += https://*.basemaps.cartocdn.com — dashboard's primary
    # dark map tile layer is CartoCDN's "dark_all" tileset. Without this,
    # the map renders ONLY the building polygons drawn by JS (purple
    # outlines on a blank white background) — exactly the symptom
    # observed in prod after the CSP overhaul. Local dev had no CSP so
    # the tiles loaded freely.
    # Apr 2026 — connect-src extended with the CDN hosts that the dashboard
    # service worker intercepts via cacheFirst. When SW does fetch(request)
    # internally on a cache miss, that fetch is governed by `connect-src`,
    # NOT `style-src`/`script-src`/`font-src` (which only apply to
    # browser-driven element loads). Without these here, the SW's internal
    # refetch was failing → SW returned 503 Offline → page broke on every
    # NORMAL refresh while hard-refresh worked (hard-refresh bypasses SW
    # so the browser-driven element fetch succeeded under style-src etc.).
    # Hosts added: unpkg, cdnjs.cloudflare.com, fonts.gstatic.com.
    # (fonts.googleapis.com already covered by https://*.googleapis.com.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://server.arcgisonline.com https://unpkg.com https://*.basemaps.cartocdn.com; connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de https://api.mapbox.com https://ipwho.is https://ipapi.co https://freeipapi.com https://geocode.maps.co https://cdn.jsdelivr.net https://storage.googleapis.com https://*.googleapis.com https://tfhub.dev https://www.kaggle.com https://unpkg.com https://cdnjs.cloudflare.com https://fonts.gstatic.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; worker-src 'self' blob:;" always;

    # Mobile app
    location /mobile-app/ {
        alias /usr/share/nginx/html/mobile-app/;
        try_files $uri $uri/ /mobile-app/src/index.html;
    }

    # Web dashboard
    location /web-dashboard/ {
        alias /usr/share/nginx/html/web-dashboard/;
        try_files $uri $uri/ /web-dashboard/src/index.html;
    }

    # Uploaded media files (photos, audio, satellite images)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Root redirect
    location = / {
        return 302 /web-dashboard/src/index.html;
    }
}
