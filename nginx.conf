server {
    listen 80;
    server_name _;

    # Apr 2026 — server-level root so the SPA fallback paths in nested
    # regex locations (which can't inherit alias from a sibling) still
    # find the file. With this set, `/web-dashboard/src/index.html`
    # resolves to `/usr/share/nginx/html/web-dashboard/src/index.html`,
    # which matches the docker-compose volume mount.
    root /usr/share/nginx/html;

    # ── CSP factored to a variable ──────────────────────────────────────
    # Defined ONCE so the same string appears in every location that
    # needs to re-emit headers. Variable interpolation in `add_header`
    # is officially supported. The CSP audit (which CDN host belongs in
    # which directive, why each is listed) lives in CSP-AUDIT.md.
    #
    # General invariant enforced by the prod-smoke test:
    #   Every cross-origin host listed in img-src / script-src / style-src
    #   / font-src that the SW is willing to intercept MUST also be in
    #   connect-src. The dashboard SW's catch-all routes any cross-origin
    #   GET through fetch(request) — that fetch is governed by connect-src,
    #   regardless of which DOM element initiated it. Without parity,
    #   normal-refresh fails (SW returns synthetic 503) while hard-refresh
    #   works (bypasses SW entirely).
    # May 2026 — S3 presigned URL hosts. boto3 generates virtual-hosted
    # style URLs but defaults to the LEGACY global endpoint
    # (`<bucket>.s3.amazonaws.com`) for non-us-east-1 buckets, which
    # gets a 307 redirect to the regional one
    # (`<bucket>.s3.ap-south-1.amazonaws.com`) at request time.
    # Both forms must be allowed in the CSP because the redirect happens
    # AFTER the CSP check — a block on the initial URL prevents the
    # redirect from ever firing. Discovered when the dashboard's
    # console showed `Refused to load <bucket>.s3.amazonaws.com/...`
    # despite the regional pattern being whitelisted.
    #
    # We allow the wildcard `*.amazonaws.com` only on `s3.amazonaws.com`
    # path (via `*.s3.amazonaws.com`) so this doesn't accidentally permit
    # other AWS service domains.
    #
    # Follow-up: configure boto3 with `addressing_style=virtual` +
    # explicit regional endpoint so we don't rely on the legacy form.
    # That'll let us drop `*.s3.amazonaws.com` from CSP later.
    set $crisp_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://server.arcgisonline.com https://unpkg.com https://*.basemaps.cartocdn.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; media-src 'self' blob: https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de https://api.mapbox.com https://ipwho.is https://ipapi.co https://freeipapi.com https://geocode.maps.co https://cdn.jsdelivr.net https://storage.googleapis.com https://*.googleapis.com https://tfhub.dev https://www.kaggle.com https://unpkg.com https://cdnjs.cloudflare.com https://fonts.gstatic.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.s3.ap-south-1.amazonaws.com https://*.s3.amazonaws.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; worker-src 'self' blob:;";

    # ── Server-level security headers (default for static asset paths) ──
    # These apply to every response UNLESS a child location has its own
    # add_header directive — then ALL the parent's headers are wiped and
    # the child must re-emit them all. That nginx rule is the reason the
    # nested HTML+SW locations below repeat all five headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $crisp_csp always;

    # ── Mobile app ──────────────────────────────────────────────────────
    location /mobile-app/ {
        alias /usr/share/nginx/html/mobile-app/;
        try_files $uri $uri/ /mobile-app/src/index.html;

        # HTML files: must revalidate every request. Without this the
        # browser heuristic-caches the HTML for hours/days and pins the
        # CSP RESPONSE HEADER from that cached entry. Even after a CSP
        # fix is deployed, browsers keep applying the old CSP from the
        # cached HTML. Manifests as "I deployed the fix but normal
        # refresh still breaks." `no-cache` actually means "must
        # revalidate every time" (304 if unchanged, 200 if changed) —
        # NOT "don't cache." Body is still locally cached and reused
        # on 304, so UX stays fast.
        location ~ \.html$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $crisp_csp always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Service worker: same no-cache treatment. Browsers do their own
        # 24h SW revalidation regardless, but explicit no-cache makes
        # SW updates land within seconds of a deploy instead of within
        # a day.
        location ~ sw\.js$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $crisp_csp always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }

    # ── Web dashboard ───────────────────────────────────────────────────
    location /web-dashboard/ {
        alias /usr/share/nginx/html/web-dashboard/;
        try_files $uri $uri/ /web-dashboard/src/index.html;

        location ~ \.html$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $crisp_csp always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location ~ sw\.js$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $crisp_csp always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }

    # ── Bare /favicon.ico (browsers auto-request from root) ─────────────
    # May 2026 — older browsers + curl + bookmarking tools all request
    # /favicon.ico from the apex even when the page links a different
    # rel=icon. Serve our SVG with the right Content-Type so the tab
    # icon shows up everywhere instead of 404'ing. SVG-as-favicon works
    # in Chrome 80+, Firefox 90+, Safari 16+. Older browsers fall back
    # to no icon, which is acceptable.
    #
    # Important: the empty `types {}` block resets the global mime.types
    # mapping for THIS location only — without it, nginx infers the
    # MIME from the request URI extension (`.ico` → `image/x-icon`)
    # and the SVG bytes get served as the wrong content-type. Browsers
    # that strict-check (Firefox + Edge) refuse to render an SVG that
    # arrives as image/x-icon, so the tab icon stays empty. Resetting
    # types lets `default_type` take effect.
    location = /favicon.ico {
        alias /usr/share/nginx/html/web-dashboard/src/favicon.svg;
        types { }
        default_type "image/svg+xml";
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Uploaded media files (photos, audio, satellite images) ──────────
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        # Re-emit security headers (the line above wipes parent's).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $crisp_csp always;
    }

    # ── API proxy to backend ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Root redirect ───────────────────────────────────────────────────
    location = / {
        return 302 /web-dashboard/src/index.html;
    }
}
