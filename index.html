<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRISP - local dev landing</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 18px;
      font: 16px -apple-system, system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; box-sizing: border-box;
    }
    h1 { font-size: 18px; margin: 8px 0 4px; color: #67e8f9; }
    p.sub { color: #94a3b8; margin: 0 0 18px; font-size: 12px; }
    a.tile {
      display: block; padding: 16px 14px; margin: 10px 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      color: #e2e8f0; text-decoration: none;
    }
    a.tile h2 { margin: 0 0 4px; font-size: 16px; color: #67e8f9; }
    a.tile p { margin: 0; font-size: 12px; color: #94a3b8; word-break: break-all; }
    a.tile:active { background: rgba(103,232,249,0.10); }
    .health { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
    .health-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(74,222,128,0.10);
      border: 1px solid rgba(74,222,128,0.4);
      color: #4ade80; font-size: 12px; font-weight: 600;
    }
    .health-pill.fail {
      background: rgba(239,68,68,0.10);
      border-color: rgba(239,68,68,0.4);
      color: #f87171;
    }
    code { background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>CRISP - local dev</h1>
  <p class="sub">Phone testing landing page. Backend + static server proven reachable.</p>

  <a class="tile" href="/mobile-app/src/">
    <h2>📱 PWA reporter</h2>
    <p>/mobile-app/src/</p>
  </a>

  <a class="tile" href="/web-dashboard/src/">
    <h2>🖥 Operator dashboard</h2>
    <p>/web-dashboard/src/</p>
  </a>

  <div class="health">
    <span id="health-pill" class="health-pill fail">Checking backend…</span>
    <span style="color:#64748b;font-size:11px">backend on :8000</span>
  </div>

  <script>
    // Hit the backend's /health through its own port. Same-LAN host,
    // different port - no CORS preflight needed for a GET on a public
    // endpoint without custom headers, but the backend's dev CORS
    // regex covers our LAN range either way.
    fetch(`http://${window.location.hostname}:8000/health`, { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        const pill = document.getElementById('health-pill');
        pill.classList.remove('fail');
        pill.textContent = `Backend OK · ${d.status}`;
      })
      .catch(e => {
        document.getElementById('health-pill').textContent = `Backend unreachable: ${e.message}`;
      });
  </script>
</body>
</html>
