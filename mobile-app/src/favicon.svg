<?xml version="1.0" encoding="UTF-8"?>
<!--
  CRISP — Crisis Response Intelligence Smart Platform
  Favicon (SVG). Shield silhouette with a centred alert mark, in the
  brand orange-to-amber gradient on the dark navy background. The shape
  is intentionally simple so it remains legible at 16x16 in browser tabs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CRISP">
  <defs>
    <linearGradient id="crispGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#0f1428"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square dark background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGradient)"/>
  <!-- Shield silhouette in orange gradient -->
  <path d="M16 4 L25 7 L25 16 C25 21 21 25.5 16 27.5 C11 25.5 7 21 7 16 L7 7 Z"
        fill="url(#crispGradient)"
        stroke="#ffd9b5"
        stroke-width="0.5"
        stroke-opacity="0.4"/>
  <!-- Alert mark (exclamation) inside the shield, white -->
  <rect x="14.6" y="9.5" width="2.8" height="9" rx="1.4" fill="#ffffff"/>
  <circle cx="16" cy="21.5" r="1.6" fill="#ffffff"/>
</svg>
