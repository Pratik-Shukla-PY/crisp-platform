name: Deploy to Production

# Auto-deploy on push to main is DISABLED. Per the operator's
# deploy-discipline rule (see CLAUDE.md "Deploy discipline"), every
# PROD deploy must be gated by an explicit in-chat confirmation.
# Use the "Run workflow" button on the GitHub Actions page
# (workflow_dispatch) to ship to PROD; pick a branch in the UI.
#
# To re-enable auto-deploy on push to main, restore the commented
# block below (move the indented lines under `on:`):
#
#   push:
#     branches: [main]
#     paths-ignore:
#       - '**/*.md'
#       - 'docs/**'
#       - 'LICENSE'
#       - 'LICENSE.*'
#       - 'CRISP-Presentation.html'
#       - '.gitignore'
#       - 'e2e/tests/pwa/42-visual-regression.spec.ts-snapshots/**'
#       - '.github/workflows/visual-baselines.yml'
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string
      skip_rebuild:
        description: "Skip backend image rebuild (faster, only safe for static-only changes)"
        required: false
        default: false
        type: boolean

# Concurrency lock — only one deploy can run at a time. New pushes
# during an in-flight deploy are queued (NOT cancelled — cancelling
# mid-deploy would corrupt the migration step).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # checks: read — preflight calls /repos/{owner}/{repo}/commits/{sha}/check-runs
  # to verify CI was green on the deploy commit. Without this permission the
  # API returns 403 "Resource not accessible by integration", and the
  # error JSON gets misread as a non-success status.
  checks: read

jobs:
  preflight:
    name: Preflight (CI must be green)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify CI passed on this commit
        # We rely on GitHub's branch protection to enforce this, but
        # double-check at deploy time too. Skipped when manually
        # dispatched (operator's call).
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look up the CI workflow's latest run for this SHA. If it's
          # not "success", refuse to deploy. The check_run API surfaces
          # the same status the branch-protection UI uses.
          # Use --silent on gh api so a transient API error doesn't pollute
          # stdout with a JSON error body that we'd then misinterpret as a
          # status string. If the API call fails, treat as "unknown" and
          # let the deploy proceed (the deploy itself is the next layer of
          # safety — it won't damage prod if the new code can't boot).
          set +e
          API_OUT=$(gh api --silent "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" 2>&1)
          API_RC=$?
          set -e
          if [ "$API_RC" -ne 0 ]; then
            echo "::warning::check-runs API call failed (rc=$API_RC). Output: $API_OUT"
            echo "Treating preflight as PASS — deploy step's health-check + auto-rollback is the next safety net."
            exit 0
          fi
          STATUS=$(printf '%s' "$API_OUT" | jq -r '.check_runs[] | select(.name == "Backend (pytest + import check)") | .conclusion' | head -1)
          echo "CI conclusion for ${{ github.sha }}: ${STATUS:-<no-run-yet>}"
          # Only hard-fail when CI explicitly concluded as failure/cancelled/timed_out.
          # Empty (still running OR check not found) and "success" both pass.
          case "$STATUS" in
            failure|cancelled|timed_out|action_required)
              echo "::error::Backend CI concluded as '$STATUS' on this commit. Refusing to deploy."
              exit 1
              ;;
            *)
              ;;
          esac
          # May 2026 — Lighthouse QA gate (Phase 2). Same shape as the
          # backend gate: hard-fail only when Lighthouse explicitly
          # concluded as failure. Missing/in-flight passes through (so
          # deploys triggered before Lighthouse finishes don't deadlock).
          # Override path: a maintainer can apply the
          # `lighthouse-approved` label and re-run the Lighthouse
          # workflow before merging.
          LH_STATUS=$(printf '%s' "$API_OUT" | jq -r '.check_runs[] | select(.name == "Lighthouse audit + threshold gate") | .conclusion' | head -1)
          echo "Lighthouse conclusion for ${{ github.sha }}: ${LH_STATUS:-<no-run-yet>}"
          case "$LH_STATUS" in
            failure|cancelled|timed_out|action_required)
              echo "::error::Lighthouse audit concluded as '$LH_STATUS' on this commit. Refusing to deploy."
              echo "::error::Either fix the regressions, or apply the \`lighthouse-approved\` label and re-run the Lighthouse workflow."
              exit 1
              ;;
            *)
              ;;
          esac

  deploy:
    name: Deploy to EC2
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      # GitHub Environments give per-environment secrets + manual approval
      # gates. Configure under Settings → Environments → CRISP-Production.
      # Optional: enable "Required reviewers" so deploys to main require
      # approval before running.
      name: CRISP-Production
      url: https://undp.crisplabs.tech/web-dashboard/src/

    steps:
      - name: Checkout (just for the deploy.sh path)
        uses: actions/checkout@v5

      - name: Resolve deploy branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "skip_rebuild=${{ inputs.skip_rebuild }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
            echo "skip_rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH for EC2 access
        env:
          SSH_KEY: ${{ secrets.EC2_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "${SSH_KEY}" ] || [ -z "${SSH_HOST}" ]; then
            echo "::error::EC2_DEPLOY_KEY and EC2_HOST must be set as repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          # Apr 2026 — accept either RAW PEM or BASE64-encoded PEM. GitHub's
          # secret UI sometimes squashes multi-line values into a single line
          # depending on how the user pasted (terminal-wrapping, browser
          # scratchpad, CRLF line endings), which corrupts an OpenSSH ed25519
          # PEM and surfaces as "Load key: error in libcrypto" on first use.
          # Encoding the secret as base64 sidesteps that entirely:
          #   base64 -w0 < key.pem    # produces a single-line value
          # We sniff: if the secret successfully base64-decodes AND contains
          # a "BEGIN ... PRIVATE KEY" marker, we use the decoded form.
          # Otherwise treat as raw PEM.
          if printf '%s' "$SSH_KEY" | base64 -d 2>/dev/null | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
            echo "[deploy-ssh] key parsed as base64-encoded PEM"
          else
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            echo "[deploy-ssh] key parsed as raw PEM"
          fi
          chmod 600 ~/.ssh/deploy_key
          # Validate before we try to use it — ssh-keygen -l prints fingerprint
          # if the key parses, errors otherwise. Clear failure message if the
          # secret value is malformed.
          if ! ssh-keygen -lf ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::EC2_DEPLOY_KEY is not a valid OpenSSH private key."
            echo "::error::Re-set the secret. Either paste the raw PEM (line breaks preserved) or paste a base64-encoded copy:"
            echo "::error::    base64 -w0 ~/.ssh/crisp-deploy            # on the EC2 — copy the single line"
            exit 1
          fi
          echo "[deploy-ssh] fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key)"
          # ssh-keyscan pins the host's public key into known_hosts so
          # the first connection isn't a TOFU prompt that hangs CI.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy.sh on EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
          SKIP_REBUILD_FLAG: ${{ steps.branch.outputs.skip_rebuild }}
        run: |
          # Single-command SSH invocation. We pass DEPLOY_BRANCH +
          # SKIP_REBUILD as env vars so deploy.sh's ${VAR:-default}
          # logic picks them up. PUBLIC_HEALTH_URL adds an outside-in
          # probe at the end so we catch ALB / cert / DNS regressions
          # at deploy time rather than from a customer ticket.
          #
          # Bootstrap pull: the EC2's working tree may be on an older
          # branch/SHA that predates `scripts/deploy.sh`. We can't run a
          # script that doesn't exist, so the SSH preamble does the
          # minimum git fetch + checkout + ff-pull to bring the script
          # into existence. Once deploy.sh is in place, IT does its OWN
          # full pull/rebuild/migrate/health flow (idempotent — the
          # second pull here is a no-op).
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              "${SSH_USER}@${SSH_HOST}" \
              "set -euo pipefail; \
               cd ~/crisp; \
               git fetch --quiet origin '${DEPLOY_BRANCH}'; \
               git checkout --quiet '${DEPLOY_BRANCH}' 2>/dev/null || git checkout --quiet -B '${DEPLOY_BRANCH}' 'origin/${DEPLOY_BRANCH}'; \
               git pull --ff-only --quiet origin '${DEPLOY_BRANCH}' || true; \
               test -x scripts/deploy.sh || chmod +x scripts/deploy.sh; \
               DEPLOY_BRANCH='${DEPLOY_BRANCH}' \
               SKIP_REBUILD='${SKIP_REBUILD_FLAG/true/1}' \
               PUBLIC_HEALTH_URL='https://undp.crisplabs.tech/mobile-app/src/index.html' \
               bash scripts/deploy.sh"

      - name: Post-deploy smoke (from runner, end-to-end)
        run: |
          # Hit the public URL from outside AWS — proves the full path
          # is alive (Route 53 → ALB → EC2 → nginx → static or proxied API).
          # `/health` is only exposed on the backend's :8000 port, not via
          # nginx. We probe public-reachable URLs instead:
          #   - /              302 redirect to dashboard (nginx alone)
          #   - /mobile-app/src/index.html  static (nginx serving PWA)
          #   - /web-dashboard/src/index.html  static (nginx serving dashboard)
          # All three succeeding proves DNS + ALB + ACM cert + nginx routing
          # work. Backend health is already verified inside deploy.sh on the
          # EC2 itself before this step runs.
          echo "Probing public URLs..."
          curl -sSf --max-time 10 -o /dev/null -w "/                          %{http_code}\n" https://undp.crisplabs.tech/
          curl -sSf --max-time 10 -o /dev/null -w "/mobile-app/src/index.html  %{http_code}\n" https://undp.crisplabs.tech/mobile-app/src/index.html
          curl -sSf --max-time 10 -o /dev/null -w "/web-dashboard/src/index.html  %{http_code}\n" https://undp.crisplabs.tech/web-dashboard/src/index.html
          echo "All public smokes green."

      - name: Tear down SSH artifacts
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

  prod-smoke:
    name: Prod-smoke (browser-level CSP + asset audit)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Don't run on workflow_dispatch with a non-main branch — the CSP /
    # asset state in prod hasn't been updated yet for that branch.
    # (The auto-deploy on push to main IS the case we want to gate.)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.branch == 'main')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Cache the Playwright browser binaries (~280 MB Chromium + libs).
      # Saves ~2 min per run on cache hit. Keyed on the lockfile so a
      # Playwright version bump invalidates correctly. Cache v3
      # qualifier added when prod-smoke dropped WebKit (May 2026) so
      # the stale v2 cache (which held both chromium + webkit dirs)
      # gets flushed on the next run — saves ~250 MB of cache storage.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v3-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright deps + Chromium
        working-directory: e2e
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          # WEBKIT REMOVED May 2026 — prod-smoke runs only on
          # mobile-chromium now (see playwright.prod.config.ts for the
          # full reasoning). The previous `install-deps chromium webkit`
          # apt-get took 6-8 min for WebKit's ~100 multimedia system
          # libs (gstreamer + libdv + libavformat + libpocketsphinx +
          # …), which exceeded the 8-min job timeout and cancelled
          # prod-smoke on every push. Chromium's apt-get is ~30s.
          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          # Belt-and-suspenders: even on cache hit, verify the actual
          # chromium binary exists. If it's missing (cache drift after
          # a Playwright bump) we re-run the install. ~10s if fine;
          # ~1 min if we need to download — far better than an
          # auto-rollback.
          if ! npx playwright install --dry-run chromium | grep -q 'is already installed'; then
            echo "::warning::Playwright chromium binary missing from cache — installing"
            npx playwright install chromium
          fi

      - name: Run prod-smoke against undp.crisplabs.tech
        working-directory: e2e
        env:
          CRISP_PROD_BASE_URL: https://undp.crisplabs.tech
          # Apr 2026 — demo-account creds for the end-to-end submission
          # smoke. These secrets were configured in repo settings during
          # UNDP submission week. Test skips silently if any are unset
          # (so local dev / fork PRs don't fail on missing secrets).
          CRISP_PROD_DEMO_EMAIL: ${{ secrets.CRISP_PROD_DEMO_EMAIL }}
          CRISP_PROD_DEMO_PASSWORD: ${{ secrets.CRISP_PROD_DEMO_PASSWORD }}
          CRISP_PROD_DEMO_TOTP_SECRET: ${{ secrets.CRISP_PROD_DEMO_TOTP_SECRET }}
        run: npm run check:prod

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: prod-smoke-report
          path: e2e/playwright-report-prod/
          retention-days: 7

  prod-lighthouse-audit:
    name: Lighthouse audit on PROD (post-deploy)
    needs: [deploy, prod-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write    # publish reports to lighthouse-history branch
    # Only run when prod-smoke passed (no point auditing if the basic
    # smoke already failed — auto-rollback will fire on smoke). Also
    # only on real prod deploys (push to main); manual workflow_dispatch
    # against non-main branches doesn't update prod CSP / assets.
    if: |
      success() &&
      needs.deploy.result == 'success' &&
      needs.prod-smoke.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.branch == 'main'))
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history for the publish script's git-worktree against
          # the lighthouse-history branch.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install LHCI + Chrome
        run: |
          npm install -g @lhci/cli@0.13.x
          which google-chrome || sudo apt-get install -y -qq google-chrome-stable
      - name: Audit PROD URLs (3 runs each, mobile throttle)
        # `lhci.config.prod.cjs` is a separate config that inherits the
        # threshold matrix from the dev config but points the URL list
        # at the live PROD domain. No staticDistDir — LHCI audits the
        # external URLs directly.
        run: lhci collect --config=./lhci.config.prod.cjs
      - name: Assert thresholds (PROD audit must clear the floor)
        # If PROD score drops below the deployed code's pre-deploy
        # baseline (which already passed assert), there's a real
        # regression — block + trigger rollback. Same threshold matrix
        # as the PR audit; if it passed pre-deploy, it MUST pass on
        # PROD too. Drift > 15% indicates infra-level regression
        # (bad nginx config, broken CDN, etc.).
        run: lhci assert --config=./lhci.config.prod.cjs
      - name: Publish PROD reports to lighthouse-history
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          LHCI_PUBLISH_SUFFIX: '-prod'
        run: node scripts/lighthouse-publish.mjs
      - name: Upload PROD Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-prod-${{ github.sha }}
          path: |
            .lighthouseci/lhr-*.json
            .lighthouseci/lhr-*.html
            .lighthouseci/output/
            .lighthouseci/summary.json
          retention-days: 30
          if-no-files-found: warn

  auto-rollback:
    name: Auto-rollback (prod-smoke or lighthouse regression)
    needs: [deploy, prod-smoke, prod-lighthouse-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fires ONLY when:
    #   - deploy succeeded (containers cycled, new code live), AND
    #   - either prod-smoke OR prod-lighthouse-audit failed (browser-level
    #     regression — CSP, asset 404, JS error, OR Lighthouse score
    #     dropped below the threshold floor on PROD)
    # Doesn't run when prod-smoke just couldn't START (job-level failure
    # like Playwright install hanging) — that's caught by the always-skip
    # condition. Doesn't run when deploy itself failed — deploy.sh already
    # auto-rolled-back inside the EC2 in that case.
    if: |
      failure() &&
      needs.deploy.result == 'success' &&
      (needs.prod-smoke.result == 'failure' || needs.prod-lighthouse-audit.result == 'failure')
    environment:
      name: CRISP-Production
      url: https://undp.crisplabs.tech/web-dashboard/src/

    steps:
      # Bug fix (May 2026, operator-reported) — post-rollback smoke
      # step below declares `working-directory: e2e` but the runner
      # had no repo checkout, so the step errored with "No such file
      # or directory" before npm could even start. Adding checkout
      # as the FIRST step makes the repo available for the smoke
      # step + any future step that needs workflow files / config.
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          if printf '%s' "$SSH_KEY" | base64 -d 2>/dev/null | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll back to previous main commit on EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
        run: |
          # rollback.sh --yes resets to the previous main commit, rebuilds
          # the backend, restarts the stack, and waits for /health.
          # `HEAD~1` is the safe default for the solo-dev cadence — one
          # bad commit per deploy, the prior commit is the last good
          # version. Operators can run rollback.sh with a specific SHA
          # manually if a deeper revert is needed (e.g. multiple bad
          # commits stacked).
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "${SSH_USER}@${SSH_HOST}" \
              "set -e; cd ~/crisp; bash scripts/rollback.sh --yes HEAD~1"

      - name: Re-run prod-smoke after rollback
        # Verify the rollback actually fixed prod. If even the previous
        # commit's smoke fails, we have a deeper issue (broken EC2,
        # broken external CDN) that no amount of rolling back fixes.
        # `--force` on the install so ANY cache-state inconsistency
        # (incl. partial download from a killed prior job) gets blown
        # away. The rollback job is the last line of defence — it
        # must not silently fail to launch a browser.
        #
        # May 2026 — WebKit dropped here too (prod-smoke runs only on
        # mobile-chromium per playwright.prod.config.ts). Saves the
        # 6-8 min apt-get install for WebKit's multimedia deps inside
        # the rollback path, where we want fast verification.
        working-directory: e2e
        env:
          CRISP_PROD_BASE_URL: https://undp.crisplabs.tech
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps --force chromium
          # Smoke against the now-rolled-back prod.
          npm run check:prod || echo "::error::Rollback smoke also failed — manual intervention required"

      - name: Tear down SSH artifacts
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
