name: CI

on:
  push:
    branches: [main, master, develop, "Pratik's"]
    # Skip CI on changes that can't affect runtime behaviour. Saves
    # ~3-4 minutes per docs / comment / baseline-only commit.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CRISP-Presentation.html'
      - '.gitignore'
      - 'e2e/tests/pwa/42-visual-regression.spec.ts-snapshots/**'
      - '.github/workflows/visual-baselines.yml'
  pull_request:
    branches: [main, master, develop, "Pratik's"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CRISP-Presentation.html'
      - '.gitignore'
      - 'e2e/tests/pwa/42-visual-regression.spec.ts-snapshots/**'
      - '.github/workflows/visual-baselines.yml'

permissions:
  contents: read
  # security-events: needed if we ever upload SARIF from gitleaks/trivy
  # to GitHub's Code Scanning surface. Keep it tight for now.
  security-events: write
  # pull-requests: read — gitleaks-action calls
  # `GET /repos/{owner}/{repo}/pulls/{pr}/commits` so it can scope its
  # scan to just the PR's new commits (not re-scan the whole history
  # on every PR run). Without this, the API returns 403 "Resource not
  # accessible by integration", gitleaks crashes, and the PR's CI is
  # marked failed even when there are no actual leaks.
  pull-requests: read

# Cancel in-progress runs for the same PR or branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + import check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: dev       # ← bypass P1.2/P1.8 fail-fast boot checks
      PYTHONUNBUFFERED: "1"
      # Apr 2026 — CRISP is Postgres-only. The backend refuses to boot
      # without a Postgres DSN. The service container below exposes
      # crisp/crisp/crisp_test on :5432. Database name MUST end in
      # `_test` — the `conftest.py` seatbelt (added Apr 2026 after
      # the dev-DB wipe incident) hard-refuses any non-`_test`
      # target so pytest can't DROP SCHEMA CASCADE a production-
      # shaped DB.
      PYTEST_DATABASE_URL: postgresql+psycopg2://crisp:crisp@localhost:5432/crisp_test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crisp
          POSTGRES_PASSWORD: crisp
          POSTGRES_DB: crisp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install $(grep -v -E "mediapipe|easyocr|faster-whisper|opencv" requirements.txt)
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install pytest pytest-asyncio httpx
      - name: Compile-check all Python modules
        working-directory: backend
        run: |
          python -m compileall -q app
      - name: Run pytest
        working-directory: backend
        run: |
          pytest -q --tb=short || (echo "Pytest failed — see logs above." && exit 1)

  mobile:
    name: React Native typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crisp-mobile/package-lock.json
      - name: Install mobile deps
        working-directory: crisp-mobile
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript typecheck
        working-directory: crisp-mobile
        run: npx tsc --noEmit

  pwa-and-dashboard:
    name: PWA + Dashboard JS syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: node --check on every .js
        run: |
          set -e
          failures=0
          for f in \
            mobile-app/src/app.js \
            mobile-app/src/pii-blur.js \
            mobile-app/src/sw.js \
            web-dashboard/src/app.js; do
            echo "checking $f"
            node --check "$f" || failures=$((failures + 1))
          done
          if [ $failures -gt 0 ]; then
            echo "$failures file(s) failed syntax check"
            exit 1
          fi

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: bash -n every .sh
        run: |
          set -e
          find scripts -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n

  secrets-hygiene:
    name: No secrets in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: .env must be ignored
        run: |
          if git ls-files | grep -E '^\.env$|^backend/\.env$'; then
            echo "ERROR: .env is tracked in git — it must be gitignored."
            exit 1
          fi
          echo "OK — .env is not tracked."

  i18n-validation:
    name: i18n — locale parity + template-var preservation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate i18n bundles
        # 232 EN keys × 6 UN languages = 1,392 translation pairs.
        # The script asserts (a) every locale has the same key set as EN,
        # (b) every {n}-style template variable in the EN value is preserved
        # in the translation. Catches translators who drop placeholders.
        # Phase 3.1 (May 2026): also catches `t('xxx')` / `data-i18n="xxx"`
        # references in source that have no key in en.json (orphan refs).
        run: |
          if [ -f scripts/validate-i18n.mjs ]; then
            node scripts/validate-i18n.mjs
          else
            echo "scripts/validate-i18n.mjs not found — skipping"
          fi
          # Crisis-pack curated-option coverage: every stock pack question +
          # select option must have a cp_/cpopt_ key in en.json (the PWA pack
          # renderer localizes the English-only stock packs via those keys).
          # validate-i18n above already enforced 22-locale parity of the keys.
          if [ -f scripts/validate-crisis-pack-i18n.mjs ]; then
            node scripts/validate-crisis-pack-i18n.mjs
          else
            echo "scripts/validate-crisis-pack-i18n.mjs not found — skipping"
          fi
      - name: Check Sentry release tags match SW cache names
        # Phase 3.2 (May 2026) — bisectable errors. The PWA + dashboard
        # service workers carry the canonical build version
        # (CACHE_NAME / APP_CACHE); Sentry's release ID comes from a
        # `<meta name="crisp-release">` tag in each HTML entrypoint.
        # A PR that bumps SW but forgets the meta tag tags Sentry
        # events with the WRONG build — making prod errors hard to
        # bisect. Fail CI here so the drift is caught at PR review.
        run: |
          if [ -f scripts/sync-release-tags.mjs ]; then
            node scripts/sync-release-tags.mjs --check
          else
            echo "scripts/sync-release-tags.mjs not found — skipping"
          fi
      - name: Check tier-config sync (PWA / dashboard / RN / shared)
        # Phase 2.1 (May 2026) — single source of truth for the V4
        # reward ladder. `shared/tier-config.json` is canonical; the
        # PWA + dashboard read auto-generated `tier-config.js`, RN
        # reads `crisp-mobile/shared/tier-config.ts`. A PR that
        # edits the JSON but forgets to re-run the generator drifts
        # the consumers — fail here so it's caught at PR review.
        run: |
          if [ -f scripts/sync-tier-config.mjs ]; then
            node scripts/sync-tier-config.mjs --check
          else
            echo "scripts/sync-tier-config.mjs not found — skipping"
          fi
      - name: Check SW asset manifest sync
        # Sprint 1A (May 2026, post-HC88) — closes the silent-drift bug
        # class that hit us in HC84/85. The pre-commit hook gates this
        # locally; CI is the second backstop in case anyone bypasses
        # the hook with --no-verify or commits from a non-husky env.
        # See scripts/generate-sw-manifest.mjs header for the migration
        # algorithm details.
        run: |
          if [ -f scripts/generate-sw-manifest.mjs ]; then
            node scripts/generate-sw-manifest.mjs --check
          else
            echo "scripts/generate-sw-manifest.mjs not found — skipping"
          fi
      - name: Check inline 22-locale i18n pack sync
        # Sprint 1A (May 2026, post-HC88) — catches the inline-pack
        # equivalent of the SW manifest drift: a locale JSON edit
        # without a generate-home-i18n-inline.mjs re-run. Drift here
        # reintroduces the language-flash bug for the affected locale
        # on first paint (~170ms warm, up to 5s cold-3G).
        run: |
          if [ -f scripts/generate-home-i18n-inline.mjs ]; then
            node scripts/generate-home-i18n-inline.mjs --check
          else
            echo "scripts/generate-home-i18n-inline.mjs not found — skipping"
          fi

  python-security:
    name: Python dep vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pip-audit (pinned 2.9.0 — see comment)
        # Pinned May 2026 — pip-audit 2.10.0 has an unhandled
        # KeyError('ranges') when the OSV API returns an advisory entry
        # without a `ranges` field (regression in _service/osv.py:135).
        # Crashes the entire audit; not a vulnerability detection,
        # just a scanner-tool bug. 2.9.0 was the prior stable release
        # and handled OSV responses without the same crash class.
        # Revisit when pip-audit ships a 2.10.1+ with the fix (likely
        # an except KeyError fallthrough in the OSV service shim).
        run: pip install 'pip-audit==2.9.0'
      - name: Audit backend dependencies
        # Hard-fail on any unsuppressed advisory — keeps the supply
        # chain honest. Each `--ignore-vuln` MUST be accompanied by a
        # comment explaining why we're safe; revisit when upstream
        # ships a fix.
        #
        #   CVE-2024-23342 (ecdsa 0.19.x — Minerva timing attack)
        #     Transitive via python-jose. We sign JWTs with HS256
        #     (HMAC-SHA256), which doesn't go through the ecdsa code
        #     path. No upstream fix as of Apr 2026 — the ecdsa
        #     maintainers consider constant-time crypto out of scope
        #     for the pure-Python lib. Re-evaluate if we ever switch
        #     JWT_ALGORITHM to ES256 / ES384, OR if we adopt cryptography
        #     for any signing.
        run: |
          pip-audit -r backend/requirements.txt --strict --vulnerability-service osv \
            --ignore-vuln CVE-2024-23342

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # Working-tree-only scan completes in seconds; 5 min is generous.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        # Sprint 2/3 (May 2026) — switched to working-tree-only scanning
        # via `gitleaks detect --no-git` (see below). Full-history scans
        # were running 14+ min wall-clock on a 494 MB / 860-commit repo,
        # repeatedly hitting the job timeout on GHA. Working-tree scans
        # finish in seconds and catch the same set of issues at HEAD:
        # any historical leak was already caught at the time of THAT
        # commit's push (we'd ratcheted up the gitleaks ruleset
        # continuously). No `fetch-depth: 0` needed — default shallow
        # clone is enough for a working-tree scan.
      # May 2026 (Sprint 4 — Node 20 deprecation cleanup) — replaced
      # gitleaks/gitleaks-action@v2 (last released Apr 2025, still on
      # Node 20, no v3 in flight) with a direct call to the gitleaks
      # Go binary. Two reasons:
      #   1. Node 20 is being deprecated by GitHub Actions mid-2026;
      #      pinning a wrapper that's stuck there is technical debt.
      #   2. The Go binary is more reproducible — explicit version pin
      #      + sha256 verification at install time, no Node runtime.
      # Functional parity: same `gitleaks detect` invocation the action
      # wraps under the hood. We lose the action's "@author notify"
      # feature, which we weren't depending on for blocking behaviour.
      - name: Install gitleaks (pinned 8.21.2)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks-checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected=$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks-checksums.txt | awk '{print $1}')
          actual=$(sha256sum /tmp/gitleaks.tgz | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "FATAL: gitleaks sha256 mismatch"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        # `--no-git`     — scan files in the checked-out working tree
        #                  rather than walking git history. ~10s wall-
        #                  clock vs ~14m for full history. Catches the
        #                  same surface at HEAD (file currently exists =
        #                  any historical leak that survived to HEAD is
        #                  still detectable). Old leaks deleted from
        #                  HEAD won't be re-flagged; that's intentional
        #                  — they were caught when they were originally
        #                  pushed (we've never had a push slip past).
        # `--redact`     — strips actual secret values from log output
        #                  so a false positive doesn't leak the secret
        #                  it found.
        # `--no-banner`  — keeps CI logs clean.
        # `--exit-code 1` — findings hard-fail the job.
        # Config lives in `.gitleaks.toml` at repo root (path allowlist
        # for known false positives in vendored libs + i18n keys).
        run: gitleaks detect --no-git --redact --no-banner --exit-code 1

  shellcheck:
    name: Shellcheck (deploy + ops scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck on shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          set -e
          find scripts -type f -name "*.sh" -print0 | xargs -0 -n1 shellcheck -x

  actionlint:
    # May 2026 (Sprint 3 institutional safeguards) — hard gate on
    # workflow YAML correctness. Would have caught both deploy-night
    # regressions in one shot:
    #   1. `actions/checkout@v4` etc. emitting Node 20 deprecation
    #      warnings (actionlint flags the action-version pin).
    #   2. The auto-rollback job declaring `working-directory: e2e`
    #      without a prior `actions/checkout@v5` step (actionlint
    #      doesn't see this specific issue, but its sibling rules
    #      catch the broader class of "step references a path the
    #      workflow never materialised").
    # No suppressions allowed without an explicit `# actionlint: ...`
    # disable directive at the offending line + a PR comment
    # justifying it. See docs/CI_HARDGATES.md (queued).
    name: Actionlint (workflow YAML hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint (pinned 1.7.12)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          # GitHub releases mirror is the canonical install path —
          # binary is signed by rhysd's release workflow. We pin the
          # full version + verify it via sha256 against the release
          # checksum file (which itself lives at the same content-
          # addressed release URL, so a man-in-the-middle would have
          # to compromise GitHub releases AND the checksum file in
          # the same release).
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.sha256 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          expected=$(grep "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" /tmp/actionlint.sha256 | awk '{print $1}')
          actual=$(sha256sum /tmp/actionlint.tgz | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "FATAL: actionlint sha256 mismatch"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Lint .github/workflows/*.yml
        # Hard gate: exit non-zero on any violation. -color for the
        # log UI; `-shellcheck=` empty disables actionlint's bundled
        # shellcheck pass (we run shellcheck as its own job above).
        run: actionlint -color -shellcheck=
