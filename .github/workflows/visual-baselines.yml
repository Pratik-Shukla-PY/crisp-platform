name: Update visual-regression baselines

# Trigger manually from the Actions tab. Generates fresh Linux PNG
# baselines for e2e/tests/pwa/42-visual-regression.spec.ts on the
# current branch, then either commits them back (if `commit: true`) or
# uploads them as an artifact for manual review + commit.
#
# Why this is a separate workflow:
#   * Linux-PNG baselines are platform-specific (anti-aliasing). The
#     committed-baselines policy is "Linux only" — generating them on
#     a contributor's local macOS / Windows box yields the wrong
#     pixel diff.
#   * The main CI workflow soft-warns on baseline drift but never
#     auto-updates baselines (that would defeat the purpose of the
#     regression guard). This workflow is the explicit refresh
#     procedure for an intentional UI change.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the regenerated baselines back to the branch'
        type: boolean
        default: false

# Cancel an in-flight refresh if the user dispatches again — only the
# latest baselines should land.
concurrency:
  group: visual-baselines
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright + Chromium
        working-directory: e2e
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Boot static server
        run: |
          nohup python3 -m http.server 8080 > /tmp/serve.log 2>&1 &
          for i in {1..15}; do
            if curl -sf http://localhost:8080/mobile-app/src/index.html >/dev/null 2>&1; then
              echo "static server up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Regenerate baselines (--update-snapshots)
        working-directory: e2e
        env:
          CI: 'true'
          CRISP_VISUAL_BASELINES_REFRESHED: '1'
        run: |
          # Drop any stale baselines first so we get a fresh set.
          rm -rf tests/pwa/42-visual-regression.spec.ts-snapshots/
          npx playwright test 42-visual-regression \
            --project=pwa \
            --update-snapshots \
            --reporter=line || true

      - name: Show what changed
        run: |
          echo "Generated baselines:"
          ls -la e2e/tests/pwa/42-visual-regression.spec.ts-snapshots/ 2>/dev/null \
            || echo "(no baselines directory created)"

      - name: Upload baselines as artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.sha }}
          path: e2e/tests/pwa/42-visual-regression.spec.ts-snapshots/
          if-no-files-found: warn

      - name: Commit + push baselines
        if: inputs.commit == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/tests/pwa/42-visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "no baseline changes — nothing to commit"
            exit 0
          fi
          git commit -m "chore(qa): refresh visual-regression baselines (linux)"
          git push
